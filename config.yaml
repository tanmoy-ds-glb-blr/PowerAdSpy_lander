default_settings:
  NETWORK: "youtube"
  INSTANCES: 3
  TIME_GAP_IN_INSTANCES: 30
  DEV_MODE: true
  HIT_GET_API: true
  SKIP_ADS_TILL: 0
  BRIGHT_PROXIES: true
  # One parent-process probe updates all workers. The interval is hard-capped
  # at 10 seconds; the probe runs in a killable helper process with an 8-second
  # hard wall so stuck DNS/socket calls cannot freeze outage detection.
  PROXY_HEALTH_CHECK_INTERVAL_SECONDS: 5
  PROXY_HEALTH_CHECK_TIMEOUT_SECONDS: 5
  PROXY_HEALTH_COUNTRY: "us"
  PROXY_HEALTH_STALE_SECONDS: 15
  PAGE_READY_TIMEOUT_SECONDS: 30
  FRAME_READY_TIMEOUT_SECONDS: 2
  CAPTURE_LAYOUT_STABLE_SAMPLES: 3
  CAPTURE_MAX_HEIGHT: 32000
  CAPTURE_MAX_WIDTH: 1920
  CAPTURE_MAX_SCROLL_STEPS: 40
  CAPTURE_MAX_SCROLL_SECONDS: 45
  SCREENSHOT_MAX_BYTES: 1048576
  SCREENSHOT_MIN_WIDTH: 960
  SCREENSHOT_MIN_QUALITY: 45
  CONSENT_ACTION: "accept"
  API_MAX_ATTEMPTS: 3
  QUEUE_MAX_ATTEMPTS: 3
  QUEUE_LEASE_SECONDS: 300
  OVERALL_SCRAPE_TIMEOUT_SECONDS: 240
  HTML_ARCHIVE_ENABLED: true
  HTML_ARCHIVE_MAX_BYTES: 15728640
  HTML_ASSET_MAX_BYTES: 5242880
  HTML_TOTAL_ASSET_MAX_BYTES: 12582912
  HTML_ASSET_MAX_COUNT: 120
  HTML_ASSET_WORKERS: 4
  HTML_ARCHIVE_TIMEOUT_SECONDS: 25
  LOG_DAILY_FOLDERS: true
  LOG_TIMEZONE: "Asia/Kolkata"
  LOG_DATE_FORMAT: "%Y-%m-%d"
  LOG_MAX_BYTES: 52428800
  LOG_BACKUP_COUNT: 50
  LOG_QUEUE_MAX_RECORDS: 20000
  LOG_QUEUE_PUT_TIMEOUT_SECONDS: 2
  LOG_HANDLER_IDLE_SECONDS: 3600
  LOG_RETENTION_DAYS: 0
  # STOP_CODE_AFTER_N_BATCHES: false
  # N_BATCHES: 1

